name: Todo App CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest pip-audit

      - name: Run Ruff
        run: |
          ruff check .

      - name: Run tests
        run: |
          pytest -v

      - name: Run pip-audit
        run: |
          pip-audit -r backend/requirements.txt

      - name: Build Docker image
        run: |
          docker build \
            -t todo-app-backend:ci \
            ./backend

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "todo-app-backend:ci"
          format: "table"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          scanners: "vuln"
          exit-code: "0"

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:v1.0 \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:latest \
            ./backend

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:v1.0
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:latest
