name: Todo App CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest pip-audit

      # 4. Ruff
      - name: Run Ruff
        run: |
          ruff check .

      # 5. Pytest
      - name: Run tests
        run: |
          pytest -v

      # 6. Dependency scan
      - name: Run pip-audit
        run: |
          pip-audit -r backend/requirements.txt

      # 7. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t todo-app-backend:ci \
            ./backend

      # 8. Trivy image scan
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "todo-app-backend:ci"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
